defaults:
  - /callbacks/rollout_lh/tasks@tasks: new_playtable_tasks
  - /annotations@val_annotations: new_playtable_validation
_target_: mode.rollout.rollout_long_horizon.RolloutLongHorizon
_recursive_: false
env_cfg:
  _target_: mode.wrappers.hulc_wrapper.HulcWrapper
skip_epochs: ${rollout_lh_skip_epochs}
rollout_freq: 2 #5
num_sequences: 1000 # 128
replan_freq: 30
ep_len: 360
empty_cache: false
log_video_to_file: true #false
num_videos: 20 #${.num_sequences} # dot to enable referencing to same config file
save_dir: ./rollout_videos
vis_lang_folder: ${vis_lang_folder}
debug: false
traj_stretch_factor: 1.1
